<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Guestbook</h1>
    <p id="list-error" role="alert"></p>

    <ul id="guestbook-list"></ul>
    <form action="" id="guestbook-form">

        <label for="name">Name</label>
        <input id="name" type="text" name="name" maxlength="40" autocomplete="off" required />
        <label for="msg">Message</label>
        <textarea id="msg" name="msg" maxlength="280" autocomplete="off" required></textarea>
        <button type="submit">Post</button>

    </form>
    <p id="form-error" role="alert"></p>

    <a href="/dashboard.html">Dashboard</a>

    <script src="/js/guestbook.js"></script>
</body>

</html>
